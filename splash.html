<!doctype html>

<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(160deg, #16171b 0%, #0c0d10 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .ghost {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: #FFFC00;
    box-shadow: 0 0 60px rgba(255, 252, 0, 0.35), 0 8px 30px rgba(0,0,0,0.4);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .ghost svg { width: 46px; height: 46px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .title {
    color: #f2f2f2;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    border-radius: 50%;
    background: #FFFC00;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }
</style>
